<!DOCTYPE html>
<!--
  Openwave — an open-source, local-first music player.
  No accounts, no servers, no third-party APIs or libraries.
  Tag parsing (ID3v2 + FLAC), storage (IndexedDB) and playback are all written from scratch.
  License: MIT
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Openwave</title>
<style>
:root{
  --bg:#e9ecf3; --surface:#ffffff; --surface-2:#eef0f6; --surface-3:#e1e5ef;
  --text:#141829; --muted:#5b6280; --faint:#9097ae; --line:rgba(20,24,41,.09);
  --accent:#f0a52a; --accent-hover:#e2961a; --on-accent:#1b1404; --accent-text:#9a6200;
  --danger:#c93a3a; --hero-a:.32; --shadow:0 10px 30px rgba(20,24,41,.14);
  --font:"Avenir Next","Segoe UI Variable Display","Segoe UI",ui-sans-serif,system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --player-h:76px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0e1a; --surface:#141829; --surface-2:#1d2236; --surface-3:#282e46;
    --text:#eef0f7; --muted:#9aa1ba; --faint:#646b85; --line:rgba(255,255,255,.08);
    --accent:#f4b23e; --accent-hover:#ffc35c; --on-accent:#1b1404; --accent-text:#f6bd57;
    --danger:#ff6b6b; --hero-a:.5; --shadow:0 12px 40px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0e1a; --surface:#141829; --surface-2:#1d2236; --surface-3:#282e46;
  --text:#eef0f7; --muted:#9aa1ba; --faint:#646b85; --line:rgba(255,255,255,.08);
  --accent:#f4b23e; --accent-hover:#ffc35c; --on-accent:#1b1404; --accent-text:#f6bd57;
  --danger:#ff6b6b; --hero-a:.5; --shadow:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  font:14px/1.45 var(--font);color:var(--text);background:var(--bg);
  display:grid;grid-template-columns:264px minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;
  grid-template-areas:"side main" "player player";gap:8px;padding:8px;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
img{max-width:100%;display:block}
.i{flex:none;display:block}
[hidden]{display:none!important}
h1,h2,h3{letter-spacing:-.025em}

/* Sidebar */
.side{grid-area:side;display:flex;flex-direction:column;gap:8px;min-height:0}
.panel{background:var(--surface);border-radius:12px}
.nav{padding:12px 8px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 12px 14px;font-weight:800;font-size:19px;letter-spacing:-.03em}
.logo{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.nav-item{display:flex;align-items:center;gap:14px;width:100%;padding:10px 12px;border-radius:8px;font-weight:700;color:var(--muted);transition:color .15s,background .15s}
.nav-item:hover{color:var(--text)}
.nav-item.active{color:var(--text);background:var(--surface-2)}
.lib{flex:1;min-height:0;display:flex;flex-direction:column}
.lib-head{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 6px 8px}
.lib-head .nav-item{width:auto}
.side-list{flex:1;overflow:auto;padding:2px 8px 8px}
.side-item{display:flex;align-items:center;gap:12px;width:100%;padding:6px;border-radius:8px}
.side-item:hover{background:var(--surface-2)}
.side-item.active{background:var(--surface-3)}
.side-item .art{width:46px;height:46px;border-radius:6px}
.side-item>span{min-width:0}
.side-item b{display:block;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-item small{color:var(--muted);font-size:12.5px}
.side-hint{color:var(--faint);font-size:13px;padding:8px 6px;margin:0}
.side-foot{padding:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.side-foot .btn{justify-content:center}
.storage{font-size:12px;color:var(--faint);padding:4px 4px 0}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;font-weight:700;background:var(--accent);color:var(--on-accent);transition:transform .1s,background .15s;white-space:nowrap}
.btn:hover{background:var(--accent-hover)}
.btn:active{transform:scale(.97)}
.btn-soft{background:var(--surface-2);color:var(--text)}
.btn-soft:hover{background:var(--surface-3)}
.btn-ghost{background:transparent;color:var(--muted)}
.btn-ghost:hover{color:var(--text);background:var(--surface-2)}
.btn.danger{background:var(--danger);color:#fff}
.icon-btn{position:relative;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:var(--muted);transition:color .15s,background .15s}
.icon-btn:hover{color:var(--text);background:var(--surface-2)}
.icon-btn.on{color:var(--accent-text)}
.btns .icon-btn.on::after{content:"";position:absolute;bottom:1px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor}
.lnk:hover{color:var(--text);text-decoration:underline}
.link{color:var(--muted);font-weight:700;font-size:13px}
.link:hover{color:var(--text);text-decoration:underline}

/* Main */
.main{grid-area:main;background:var(--surface);border-radius:12px;overflow:auto;position:relative;min-height:0;overscroll-behavior:contain}
.topbar{position:sticky;top:0;z-index:5;height:60px;display:flex;align-items:center;gap:10px;padding:0 20px;background:color-mix(in srgb,var(--surface) 84%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.spacer{flex:1}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:999px;padding:0 14px;height:42px;flex:1;max-width:440px;color:var(--muted);border:2px solid transparent}
.searchbox:focus-within{border-color:var(--text)}
.searchbox input{all:unset;flex:1;color:var(--text);font-size:15px;min-width:0}
.content{padding:4px 24px 36px}
.content .tracks{padding:0}
.page-title{font-size:30px;margin:6px 0 18px}
.sec{margin-top:32px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.sec-head h2{margin:0;font-size:21px}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.tile{position:relative;display:flex;align-items:center;gap:14px;background:var(--surface-2);border-radius:8px;overflow:hidden;font-weight:700;padding-right:58px;min-width:0;transition:background .15s}
.tile:hover{background:var(--surface-3)}
.tile .art{width:64px;height:64px;border-radius:0}
.tile span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(140px,17vw,184px);gap:6px;overflow-x:auto;padding-bottom:6px;margin:0 -12px;scroll-snap-type:x proximity}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px;margin:0 -12px}
.card{position:relative;padding:12px;border-radius:10px;cursor:pointer;scroll-snap-align:start;min-width:0}
.card:hover{background:var(--surface-2)}
.art-wrap{position:relative}
.art-wrap .art{width:100%;height:auto;aspect-ratio:1;border-radius:8px;box-shadow:var(--shadow)}
.card.round .art{border-radius:50%}
.card-t{margin-top:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-s{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fab{position:absolute;right:8px;bottom:8px;width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 8px 18px rgba(0,0,0,.3);opacity:0;transform:translateY(6px);transition:opacity .18s,transform .18s}
.card:hover .fab,.card:focus-within .fab{opacity:1;transform:none}
.tile .fab{right:10px;bottom:auto;top:50%;width:40px;height:40px;transform:translateY(-50%) scale(.9)}
.tile:hover .fab,.tile:focus-within .fab{opacity:1;transform:translateY(-50%)}
@media (hover:none){.fab{opacity:1;transform:none}.tile .fab{transform:translateY(-50%)}}

/* Artwork */
.art{flex:none;overflow:hidden;object-fit:cover;background:var(--surface-3)}
.ph{display:grid;place-items:center;color:rgba(255,255,255,.88);background:linear-gradient(135deg,hsl(var(--h) 55% 50%),hsl(calc(var(--h) + 55) 60% 28%))}
.ph .i,.liked-art .i{width:40%;height:40%;max-width:64px;max-height:64px}
.liked-art{display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#f4b23e,#d9466f 70%)}
.mosaic{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;aspect-ratio:1}
.mosaic img{width:100%;height:100%;min-height:0;object-fit:cover}
.art-empty{background:var(--surface-2)}

/* Hero */
.hero{display:flex;align-items:flex-end;gap:24px;margin-top:-60px;padding:84px 24px 24px;background:linear-gradient(180deg,hsl(var(--h) 60% 50% / var(--hero-a)),hsl(var(--h) 60% 50% / 0))}
.hero>.art{width:clamp(128px,22vw,224px);height:auto;aspect-ratio:1;border-radius:8px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.hero.round>.art{border-radius:50%}
.hero-meta{min-width:0}
.kind{font-size:13px;font-weight:700}
.hero h1{font-size:clamp(30px,5.6vw,68px);line-height:1.02;letter-spacing:-.045em;margin:6px 0 12px;overflow-wrap:anywhere}
.sub{color:var(--muted)}
.sub b{color:var(--text)}
.actions{display:flex;align-items:center;gap:12px;padding:20px 24px}
.bigplay{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.22);transition:transform .1s,background .15s}
.bigplay:hover{transform:scale(1.05);background:var(--accent-hover)}
.sort{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin-left:auto}
.sort select{background:var(--surface-2);color:var(--text);border:0;border-radius:6px;padding:7px 10px;font:inherit;font-size:13px}

/* Track list */
.tracks{padding:0 16px 28px}
.thead,.row{display:grid;grid-template-columns:44px minmax(0,5fr) minmax(0,3fr) 40px 60px 40px;align-items:center;gap:12px;padding:0 12px}
.tracks.noalb .thead,.tracks.noalb .row{grid-template-columns:44px minmax(0,1fr) 40px 60px 40px}
.tracks.noalb .alb,.tracks.noalb .h-alb{display:none}
.thead{position:sticky;top:60px;z-index:2;height:36px;margin-bottom:8px;border-bottom:1px solid var(--line);color:var(--muted);font-size:13px;background:var(--surface)}
.h-num{text-align:center}
.h-dur{display:flex;justify-content:flex-end}
.row{height:56px;border-radius:6px;cursor:pointer;user-select:none;-webkit-user-select:none}
.row:hover{background:var(--surface-2)}
.num{display:grid;place-items:center;color:var(--muted);font-variant-numeric:tabular-nums}
.rowplay{display:none;color:var(--text)}
.eq{display:none;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;height:3px;background:var(--accent);border-radius:1px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.35s}
.eq i:nth-child(3){animation-delay:-.6s}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}
body:not(.is-playing) .eq i{animation-play-state:paused}
.row:hover .n{display:none}
.row:hover .rowplay{display:grid}
.row.playing .n{display:none}
.row.playing .eq{display:flex}
.row.playing:hover .eq{display:none}
.row.playing .t{color:var(--accent-text)}
.ttl{display:flex;align-items:center;gap:12px;min-width:0}
.ttl .art{width:40px;height:40px;border-radius:4px}
.ttl-meta{min-width:0}
.t{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a,.alb{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dur{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;font-size:13px}
.row .like,.row .more{opacity:0}
.row:hover .like,.row:hover .more,.row .like.on,.row .more:focus-visible,.row .like:focus-visible{opacity:1}
.like.on{color:var(--accent-text)}
@media (hover:none){.row .like,.row .more{opacity:1}}
.empty-small{color:var(--muted);padding:24px 0}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 4px}
.chip{padding:7px 15px;border-radius:999px;background:var(--surface-2);font-weight:650;font-size:13.5px}
.chip:hover{background:var(--surface-3)}
.chip.active{background:var(--text);color:var(--surface)}
.new-card .art-wrap .art{display:grid;place-items:center;background:var(--surface-2);box-shadow:none;border:2px dashed var(--line);color:var(--muted)}

/* Empty state */
.empty{max-width:540px;margin:9vh auto 0;text-align:center;padding:0 16px 40px}
.empty .big{width:92px;height:92px;border-radius:26px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin:0 auto 24px;transform:rotate(-6deg)}
.empty h1{font-size:32px;margin:0 0 10px}
.empty p{color:var(--muted);font-size:15.5px;margin:0 auto 26px;max-width:46ch}
.empty .btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.empty small{display:block;margin-top:20px;color:var(--faint);font-size:12.5px}

/* Player */
.player{grid-area:player;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) minmax(0,1fr);align-items:center;gap:16px;height:var(--player-h);padding:0 8px}
.np{display:flex;align-items:center;gap:12px;min-width:0}
#npArt .art{width:56px;height:56px;border-radius:6px}
.np-meta{min-width:0}
.np-t{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-a{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-like.on{color:var(--accent-text)}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.btns{display:flex;align-items:center;gap:10px}
.play{width:40px;height:40px;border-radius:50%;background:var(--text);color:var(--surface);display:grid;place-items:center;transition:transform .1s}
.play:hover{transform:scale(1.06)}
.seek{display:flex;align-items:center;gap:8px;width:100%;max-width:640px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.seek span{width:42px;text-align:center;flex:none}
.extra{display:flex;align-items:center;justify-content:flex-end;gap:4px}
.extra .range{flex:0 1 110px}
.range{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:4px;border-radius:4px;margin:0;cursor:pointer;background:linear-gradient(to right,var(--text) var(--p,0%),var(--surface-3) var(--p,0%))}
.range:hover{background:linear-gradient(to right,var(--accent) var(--p,0%),var(--surface-3) var(--p,0%))}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--text);opacity:0;transition:opacity .15s}
.range:hover::-webkit-slider-thumb,.range:focus-visible::-webkit-slider-thumb{opacity:1}
.range::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--text);opacity:0}
.range:hover::-moz-range-thumb,.range:focus-visible::-moz-range-thumb{opacity:1}

/* Overlays */
.queue{position:fixed;z-index:30;top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + var(--player-h) + 16px);width:min(360px,calc(100% - 16px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.q-head{display:flex;align-items:center;justify-content:space-between;padding:12px 10px 4px 18px}
.q-head h3{margin:0;font-size:17px}
.q-body{overflow:auto;padding:0 8px 16px}
.q-label{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-weight:700;font-size:13.5px;color:var(--muted);padding:14px 10px 6px}
.q-item{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:6px;cursor:pointer;min-width:0}
.q-item:hover{background:var(--surface-2)}
.q-item .art{width:40px;height:40px;border-radius:4px}
.q-item .meta{min-width:0;flex:1}
.q-item.now{cursor:default}
.q-item.now .t{color:var(--accent-text)}
.q-empty{color:var(--faint);padding:4px 10px;margin:0}
.menu{position:fixed;z-index:40;min-width:220px;max-width:290px;max-height:min(440px,72vh);overflow:auto;background:var(--surface-3);border-radius:8px;padding:4px;box-shadow:var(--shadow)}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:4px;font-size:13.5px}
.menu button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu button:hover{background:color-mix(in srgb,var(--text) 9%,transparent)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu .lbl{padding:8px 12px 2px;font-size:12px;color:var(--muted);font-weight:700}
.menu .danger{color:var(--danger)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(6,8,16,.55);display:grid;place-items:center;padding:16px}
.dialog{background:var(--surface);border-radius:12px;padding:22px;width:min(400px,100%);box-shadow:var(--shadow)}
.dialog h3{margin:0 0 14px;font-size:20px}
.dialog p{color:var(--muted);margin:0 0 6px}
.dialog input{width:100%;padding:12px 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);font:inherit;font-size:15px}
.dialog .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:fixed;z-index:60;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + var(--player-h) + 24px);transform:translateX(-50%);background:var(--text);color:var(--surface);padding:10px 16px;border-radius:8px;font-weight:600;font-size:13.5px;box-shadow:var(--shadow);max-width:calc(100% - 32px);min-width:200px;text-align:center}
.toast .bar{height:3px;border-radius:3px;margin-top:8px;overflow:hidden;background:color-mix(in srgb,var(--surface) 25%,transparent)}
.toast .bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.drop{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(6,8,16,.7);color:#fff;pointer-events:none}
.drop div{border:3px dashed var(--accent);border-radius:20px;padding:48px 64px;text-align:center;font-size:22px;font-weight:800}
.drop small{display:block;font-size:14px;font-weight:500;opacity:.75;margin-top:6px}
.badge{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--surface-3);color:var(--muted);margin-right:6px;vertical-align:1px}
.disc-search{max-width:560px;height:48px}
.setup{background:var(--surface-2);border-radius:10px;padding:16px;max-width:560px}
.setup p{margin:0 0 12px;color:var(--muted)}
.setup p b{color:var(--text)}
.setup a{color:var(--accent-text)}
.setup-row{display:flex;gap:8px}
.setup-row input{flex:1;min-width:0;padding:10px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit}
.note{color:var(--faint);font-size:12.5px;margin-top:32px;max-width:70ch}
.tabs{display:none}

@media (max-width:760px){
  body{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto auto;grid-template-areas:"main" "player" "tabs";gap:0;padding:0}
  .side{display:none}
  .main{border-radius:0}
  .topbar{padding:0 12px}
  .topbar .btn span{display:none}
  .topbar .btn{padding:9px 11px}
  .content{padding:4px 16px 28px}
  .shelf,.grid{margin:0 -8px}
  .card{padding:8px}
  .tiles{grid-template-columns:1fr 1fr;gap:8px}
  .tile{gap:10px;padding-right:8px;font-size:13px}
  .tile .art{width:52px;height:52px}
  .tile .fab{display:none}
  .player{grid-template-columns:minmax(0,1fr) auto;height:64px;margin:6px 8px 0;padding:0 6px;border-radius:10px;background:var(--surface-2);position:relative;overflow:hidden}
  #npArt .art{width:46px;height:46px}
  .ctrl{flex-direction:row}
  .btns{gap:2px}

/* ---------- Storage (IndexedDB, with in-memory fallback) ---------- */
const memFiles = new Map();
const DB = {
  db: null, ok: false,
  async open(){
    try{
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('openwave', 1);
        r.onupgradeneeded = () => {
          const d = r.result;
          d.createObjectStore('tracks', { keyPath: 'id' });

      this.ok = true;
    }catch(e){ this.ok = false; }
  },
  tx(store, mode, fn){
    if (!this.ok) return Promise.resolve(null);
    return new Promise((res, rej) => {
      try{
        const t = this.db.transaction(store, mode); const r = fn(t.objectStore(store));
        t.oncomplete = () => res(r ? r.result : null);
        t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);

  all(s){ return this.tx(s, 'readonly', st => st.getAll()); },
  get(s, k){ return this.tx(s, 'readonly', st => st.get(k)); },
  put(s, v){ return this.tx(s, 'readwrite', st => st.put(v)); },
  del(s, k){ return this.tx(s, 'readwrite', st => st.delete(k)); },

async function saveFile(id, blob){ if (DB.ok) await DB.put('files', { id, blob }); else memFiles.set(id, blob); }

const saveKV = (k, v) => DB.put('kv', { k, v }).catch(() => {});

/* ---------- State ---------- */
const S = {
  tracks: new Map(), liked: new Set(), playlists: [], coverUrls: new Map(),
  view: { name: 'home' }, history: [], libTab: 'songs', sortName: 'recent', query: '',
  lists: {}, context: [], contextLabel: '', contextSig: '', order: [], pos: -1, userQueue: [], current: null,
  shuffle: false, repeat: 'off', volume: .8, muted: false,
  discSrc: 'all', dq: '', discCache: new Map(), discLoading: new Set(), jamendoId: '',

    (covers || []).forEach(c => S.coverUrls.set(c.key, URL.createObjectURL(c.blob)));

    if (Array.isArray(m.liked)) S.liked = new Set(m.liked.filter(id => S.tracks.has(id)));

    if (m.settings){
      S.shuffle = !!m.settings.shuffle;
      S.repeat = ['off','all','one'].includes(m.settings.repeat) ? m.settings.repeat : 'off';
      S.volume = typeof m.settings.volume === 'number' ? m.settings.volume : .8;

/* ---------- Tag reading: ID3v2.2/2.3/2.4 and FLAC, written by hand ---------- */
const u32 = (b, p) => ((b[p] << 24) | (b[p+1] << 16) | (b[p+2] << 8) | b[p+3]) >>> 0;
const ss = (b, p) => ((b[p] & 0x7f) << 21) | ((b[p+1] & 0x7f) << 14) | ((b[p+2] & 0x7f) << 7) | (b[p+3] & 0x7f);
function unsync(b){ const o = new Uint8Array(b.length); let j = 0; for (let i = 0; i < b.length; i++){ o[j++] = b[i]; if (b[i] === 0xFF && b[i+1] === 0) i++; } return o.subarray(0, j); }
function decodeText(b, enc){
  let label = ['latin1', 'utf-16le', 'utf-16be', 'utf-8'][enc] || 'latin1';
  if (enc === 1){
    if (b[0] === 0xFE && b[1] === 0xFF){ label = 'utf-16be'; b = b.subarray(2); }
    else if (b[0] === 0xFF && b[1] === 0xFE){ label = 'utf-16le'; b = b.subarray(2); }
  }
  try{ return new TextDecoder(label).decode(b).replace(/\0[\s\S]*$/, '').trim(); }catch(e){ return ''; }
}
function parsePic(d, v22){
  const enc = d[0]; let p = 1, mime = 'image/jpeg';
  if (v22){ const f = String.fromCharCode(d[1], d[2], d[3]).toLowerCase(); mime = f === 'png' ? 'image/png' : 'image/jpeg'; p = 4; }
  else {
    let e = p; while (e < d.length && d[e] !== 0) e++;
    const m = new TextDecoder('latin1').decode(d.subarray(p, e)).toLowerCase();
    if (m) mime = m.includes('/') ? m : 'image/' + m.replace('jpg', 'jpeg');
    p = e + 1;
  }
  p++; // picture type
  if (enc === 1 || enc === 2){ while (p + 1 < d.length && !(d[p] === 0 && d[p+1] === 0)) p += 2; p += 2; }
  else { while (p < d.length && d[p] !== 0) p++; p++; }

function parseId3(buf, ver, flags, out){
  if (ver < 4 && (flags & 0x80)) buf = unsync(buf);

    const id = String.fromCharCode(...buf.subarray(pos, pos + idLen));

    const size = ver === 2 ? ((buf[pos+3] << 16) | (buf[pos+4] << 8) | buf[pos+5]) : ver === 4 ? ss(buf, pos + 4) : u32(buf, pos + 4);
    const ff = ver === 2 ? 0 : buf[pos + 9];
    let d = buf.subarray(pos + hdr, pos + hdr + size);
    pos += hdr + size;
    if (size <= 0) continue;
    if (ver === 3 && (ff & 0xC0)) continue;
    if (ver === 4){ if (ff & 0x0C) continue; if (ff & 0x01) d = d.subarray(4); if (ff & 0x02) d = unsync(d); }

      case 'TPE1': case 'TP1': out.artist = out.artist || txt(); break;
      case 'TALB': case 'TAL': out.album = out.album || txt(); break;
      case 'TPE2': case 'TP2': out.albumArtist = out.albumArtist || txt(); break;
      case 'TRCK': case 'TRK': out.trackNo = out.trackNo || parseInt(txt()) || 0; break;
      case 'APIC': case 'PIC': if (!out.picture) out.picture = parsePic(d, ver === 2); break;

async function readFlac(file, out){
  let pos = 4;
  for (let n = 0; n < 64; n++){
    const h = new Uint8Array(await file.slice(pos, pos + 4).arrayBuffer());
    if (h.length < 4) break;
    const last = h[0] & 0x80, type = h[0] & 0x7f, len = (h[1] << 16) | (h[2] << 8) | h[3];
    pos += 4;
    if (type === 4 || (type === 6 && !out.picture)){
      const d = new Uint8Array(await file.slice(pos, pos + len).arrayBuffer());
      const dv = new DataView(d.buffer, d.byteOffset, d.byteLength);
      if (type === 4){
        let p = 0; p += 4 + dv.getUint32(p, true);
        const count = dv.getUint32(p, true); p += 4;
        const td = new TextDecoder('utf-8');
        for (let i = 0; i < count && p + 4 <= d.length; i++){
          const l = dv.getUint32(p, true); p += 4;
          const s = td.decode(d.subarray(p, p + l)); p += l;
          const eq = s.indexOf('='); if (eq < 0) continue;
          const k = s.slice(0, eq).toUpperCase(), v = s.slice(eq + 1).trim(); if (!v) continue;
          if (k === 'TITLE' && !out.title) out.title = v;
          else if (k === 'ARTIST' && !out.artist) out.artist = v;
          else if (k === 'ALBUM' && !out.album) out.album = v;
          else if (k === 'ALBUMARTIST' && !out.albumArtist) out.albumArtist = v;
          else if (k === 'TRACKNUMBER' && !out.trackNo) out.trackNo = parseInt(v) || 0;
        }
      } else {
        let p = 4; const ml = dv.getUint32(p); p += 4;
        const mime = new TextDecoder().decode(d.subarray(p, p + ml)); p += ml;
        p += 4 + dv.getUint32(p) + 16;
        const dl = dv.getUint32(p); p += 4;
        if (dl > 100) out.picture = new Blob([d.slice(p, p + dl)], { type: mime || 'image/jpeg' });

}
async function readTags(file){
  const out = {};
  try{
    const h = new Uint8Array(await file.slice(0, 10).arrayBuffer());
    if (h[0] === 0x49 && h[1] === 0x44 && h[2] === 0x33){
      const size = Math.min(ss(h, 6), 30 * 1024 * 1024);
      const buf = new Uint8Array(await file.slice(10, 10 + size).arrayBuffer());
      parseId3(buf, h[3], h[5], out);
    } else if (h[0] === 0x66 && h[1] === 0x4C && h[2] === 0x61 && h[3] === 0x43){
      await readFlac(file, out);
    }
  }catch(e){}
  return out;
}
function fromFilename(name){
  let base = name.replace(/\.[^.]+$/, '').replace(/_/g, ' ').trim();
  base = base.replace(/^\d{1,3}[\s.\-]+/, '');
  const parts = base.split(' - ');
  if (parts.length >= 2) return { artist: parts[0].trim(), title: parts.slice(1).join(' - ').trim() };
  return { title: base || name, artist: '' };
}
function probeDuration(file){
  return new Promise(res => {
    const a = new Audio(), url = URL.createObjectURL(file); let done = false;
    const fin = v => { if (done) return; done = true; URL.revokeObjectURL(url); a.removeAttribute('src'); res(v); };

    a.onloadedmetadata = () => {
      if (a.duration === Infinity){ a.ontimeupdate = () => { a.ontimeupdate = null; fin(isFinite(a.duration) ? a.duration : 0); }; a.currentTime = 1e7; }
      else fin(a.duration);
    };
    a.onerror = () => fin(null);
    setTimeout(() => fin(0), 8000);
    a.src = url;
  });

/* ---------- Import ---------- */
const AUDIO_EXT = /\.(mp3|m4a|aac|flac|wav|ogg|oga|opus|webm|weba)$/i;
const UNKNOWN_ALBUM = 'Unknown album';
const albumKey = t => t.album === UNKNOWN_ALBUM ? 'single:' + t.id : ((t.albumArtist || t.artist) + '|' + t.album).toLowerCase();
const coverFor = t => t.cover || S.coverUrls.get(albumKey(t));
const libTracks = () => [...S.tracks.values()].filter(t => !t.eph);
const seedOf = t => t.album === UNKNOWN_ALBUM ? t.title + t.artist : albumKey(t);
let importing = false;

async function importFiles(list){
  const files = [...list].filter(f => f && ((f.type || '').startsWith('audio/') || AUDIO_EXT.test(f.name)));
  if (!files.length){ toast('No audio files found. Supported: MP3, M4A, AAC, FLAC, WAV, OGG, OPUS.'); return; }
  if (importing){ toast('Already adding music. Try again when it finishes.'); return; }
  importing = true;
  const seen = new Set(libTracks().map(t => t.fileName + '|' + t.size));
  let added = 0, skipped = 0, failed = 0, full = false;
  for (let i = 0; i < files.length; i++){
    const f = files[i]; progress(i, files.length);
    if (seen.has(f.name + '|' + f.size)){ skipped++; continue; }
    try{
      const duration = await probeDuration(f);
      if (duration === null){ failed++; continue; }
      const tags = await readTags(f), fb = fromFilename(f.name);
      const t = {
        id: uid(), title: tags.title || fb.title, artist: tags.artist || fb.artist || 'Unknown artist',
        album: tags.album || UNKNOWN_ALBUM, albumArtist: tags.albumArtist || '', trackNo: tags.trackNo || 0,
        duration: duration || 0, addedAt: Date.now() + i, fileName: f.name, size: f.size,
      };
      await saveFile(t.id, f);
      await DB.put('tracks', t);
      const k = albumKey(t);
      if (tags.picture && !S.coverUrls.has(k)){
        await DB.put('covers', { key: k, blob: tags.picture }).catch(() => {});
        S.coverUrls.set(k, URL.createObjectURL(tags.picture));
      }
      S.tracks.set(t.id, t); seen.add(f.name + '|' + f.size); added++;
    }catch(e){
      if (e && e.name === 'QuotaExceededError'){ full = true; break; }
      failed++;
    }
  }
  importing = false;
  render(); updateStorage();
  if (full) toast(`Browser storage is full. Added ${added} before stopping — delete some songs to make room.`, 6000);
  else {
    const bits = [`Added ${plural(added, 'song')}`];
    if (skipped) bits.push(`${skipped} already in your library`);
    if (failed) bits.push(`${failed} couldn’t be played by this browser`);
    toast(bits.join(', ') + '.', 4500);
  }
}
async function filesFromDrop(dt){
  const entries = [...(dt.items || [])].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (!entries.length) return [...dt.files];
  const out = [];
  async function walk(en){
    if (en.isFile) out.push(await new Promise(r => en.file(r, () => r(null))));
    else if (en.isDirectory){
      const reader = en.createReader(); let batch;
      do { batch = await new Promise(r => reader.readEntries(r, () => r([]))); for (const e of batch) await walk(e); } while (batch.length);
    }
  }
  for (const en of entries) await walk(en);
  return out.filter(Boolean);
}

/* ---------- Library queries ---------- */
const SORTS = { recent:['addedAt',-1,'Recently added'], title:['title',1,'Title'], artist:['artist',1,'Artist'], album:['album',1,'Album'], duration:['duration',-1,'Longest first'] };
function sortedSongs(){
  const [key, dir] = SORTS[S.sortName] || SORTS.recent;
  return libTracks().sort((a, b) => {
    const x = a[key], y = b[key];
    const r = typeof x === 'string' ? x.localeCompare(y, undefined, { sensitivity: 'base' }) : (x - y);
    return r * dir || a.title.localeCompare(b.title);
  }).map(t => t.id);
}
const byAlbumOrder = (a, b) => (a.trackNo || 999) - (b.trackNo || 999) || a.title.localeCompare(b.title);
function albumIds(key){ return [...S.tracks.values()].filter(t => albumKey(t) === key).sort(byAlbumOrder).map(t => t.id); }
function artistIds(name){
  return [...S.tracks.values()].filter(t => t.artist === name || t.albumArtist === name)
    .sort((a, b) => a.album.localeCompare(b.album) || byAlbumOrder(a, b)).map(t => t.id);
}
const likedIds = () => [...S.liked].reverse().filter(id => S.tracks.has(id));
function albums(){
  const m = new Map();
  for (const t of libTracks()){
    if (t.album === UNKNOWN_ALBUM) continue;
    const k = albumKey(t);
    if (!m.has(k)) m.set(k, { key: k, name: t.album, artist: t.albumArtist || t.artist, count: 0, addedAt: 0 });
    const a = m.get(k); a.count++; a.cover = a.cover || coverFor(t); a.addedAt = Math.max(a.addedAt, t.addedAt);
  }
  return [...m.values()].sort((a, b) => a.name.localeCompare(b.name));
}
function artists(){
  const m = new Map();
  for (const t of libTracks()){
    if (!m.has(t.artist)) m.set(t.artist, { name: t.artist, count: 0, cover: null, addedAt: 0 });
    const a = m.get(t.artist); a.count++; a.cover = a.cover || coverFor(t); a.addedAt = Math.max(a.addedAt, t.addedAt);
  }
  return [...m.values()].sort((a, b) => a.name.localeCompare(b.name));
}
function totalTime(ids){
  let s = 0; ids.forEach(id => s += S.tracks.get(id)?.duration || 0); s = Math.round(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h} hr ${m} min` : `${m} min ${s % 60} sec`;
}
let listN = 0;
function reg(ids, label, sig){ const k = 'L' + (++listN); S.lists[k] = { ids, label, sig }; return k; }
const isActive = lk => { const L = S.lists[lk]; return !!(L && S.current && L.sig === S.contextSig && !audio.paused); };

function art(url, seed, cls = ''){

}

function playlistArt(p){

  if (urls.length === 4) return `<div class="art mosaic">${urls.map(u => `<img src="${u}" alt="">`).join('')}</div>`;
  return art(urls[0], p.name);
}

async function playId(id){
  const t = S.tracks.get(id); if (!t) return;
  let newUrl = null, src = null;
  if (!t.src || t.offline){ const blob = await getFile(id); if (blob){ newUrl = URL.createObjectURL(blob); src = newUrl; } }
  if (!src && t.src){ try{ src = await streamUrl(t); }catch(e){} }
  if (!src){ toast(t.src ? `Couldn’t reach ${SRC_FULL[t.src]} to stream “${t.title}”.` : `The audio for “${t.title}” is missing. Re-add the file.`); return; }
  const old = curUrl; curUrl = newUrl;
  S.current = id; audio.src = src; if (old) URL.revokeObjectURL(old);
  try{ await audio.play(); }catch(e){}
  updatePlayer(); markPlaying(); renderQueue(); setMediaSession(t);
}
function buildOrder(startId){
  const n = S.context.length, idx = startId != null ? S.context.indexOf(startId) : -1;
  if (S.shuffle){
    const rest = shuffleArr([...Array(n).keys()].filter(i => i !== idx));
    S.order = idx >= 0 ? [idx, ...rest] : rest; S.pos = 0;
  } else { S.order = [...Array(n).keys()]; S.pos = Math.max(0, idx); }
}
function playFrom(ids, startId, label, s){
  if (!ids.length) return;
  S.context = ids.slice(); S.contextLabel = label; S.contextSig = s;
  buildOrder(startId);
  playId(S.context[S.order[S.pos]]);
}
const ctxId = () => S.order.length ? S.context[S.order[S.pos]] : null;
function next(auto = false){
  if (S.userQueue.length) return playId(S.userQueue.shift());
  if (!S.order.length) return;
  if (S.pos + 1 < S.order.length) S.pos++;
  else if (S.repeat === 'all'){ if (S.shuffle) S.order = shuffleArr([...Array(S.context.length).keys()]); S.pos = 0; }
  else { if (auto){ audio.pause(); audio.currentTime = 0; } return; }
  playId(ctxId());
}
function prev(){
  if (audio.currentTime > 3 || !S.order.length){ audio.currentTime = 0; return; }
  if (S.current !== ctxId()) return playId(ctxId());
  if (S.pos > 0) S.pos--;
  else if (S.repeat === 'all') S.pos = S.order.length - 1;
  else { audio.currentTime = 0; return; }
  playId(ctxId());
}
function togglePlay(){

    if (S.tracks.size) return playFrom(sortedSongs(), null, 'Your Library', 'library');

}

function ask({ title, body = '', value = '', input = true, confirm = 'Save', danger = false }){
  return new Promise(resolve => {
    modal.innerHTML = `<form class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgT"><h3 id="dlgT">${esc(title)}</h3>${body ? `<p>${body}</p>` : ''}${input ? `<input name="v" maxlength="100" value="${esc(value)}" autocomplete="off" aria-label="${esc(title)}">` : ''}<div class="acts"><button type="button" class="btn btn-ghost" data-m="x">Cancel</button><button type="submit" class="btn${danger ? ' danger' : ''}">${esc(confirm)}</button></div></form>`;
    modal.hidden = false;
    const f = modal.querySelector('form'), inp = f.querySelector('input');
    setTimeout(() => { (inp || f.querySelector('[type=submit]')).focus(); inp && inp.select(); }, 20);
    const onKey = e => { if (e.key === 'Escape'){ e.stopPropagation(); done(null); } };
    const done = v => { modal.hidden = true; modal.onclick = null; document.removeEventListener('keydown', onKey, true); resolve(v); };
    document.addEventListener('keydown', onKey, true);
    f.onsubmit = e => { e.preventDefault(); if (!input) return done(true); const v = inp.value.trim(); if (!v) return inp.focus(); done(v); };
    modal.onclick = e => { if (e.target === modal || e.target.closest('[data-m="x"]')) done(null); };
  });
}

/* ---------- Online catalogs: free, legal, full-length streams ---------- */
const APP = 'Openwave';
const SRC_NAMES = { audius: 'Audius', archive: 'Archive', jamendo: 'Jamendo' };
const SRC_FULL = { audius: 'Audius', archive: 'Internet Archive', jamendo: 'Jamendo' };
let audiusHost = null, dqTimer;
async function getJSON(url){ const r = await fetch(url); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }
async function audiusBase(){
  if (audiusHost) return audiusHost;
  try{ const j = await getJSON('https://api.audius.co'); const h = j.data || []; if (h.length) audiusHost = h[Math.floor(Math.random() * h.length)]; }catch(e){}
  return audiusHost || (audiusHost = 'https://discoveryprovider.audius.co');
}
function parseLen(v){
  if (!v) return 0; const s = String(v);
  return s.includes(':') ? s.split(':').reduce((a, x) => a * 60 + (parseFloat(x) || 0), 0) : (parseFloat(s) || 0);
}
const first = v => Array.isArray(v) ? v[0] : v;
async function streamUrl(t){
  if (t.src === 'audius') return `${await audiusBase()}/v1/tracks/${encodeURIComponent(t.extId)}/stream?app_name=${APP}`;
  return t.url;
}
const SOURCES = {
  async audius(q){
    const b = await audiusBase();
    const j = await getJSON(q ? `${b}/v1/tracks/search?query=${encodeURIComponent(q)}&app_name=${APP}` : `${b}/v1/tracks/trending?time=week&app_name=${APP}`);
    return (j.data || []).filter(t => t.is_streamable !== false && !t.stream_conditions).slice(0, 40).map(t => ({
      src: 'audius', extId: t.id, title: t.title || 'Untitled', artist: t.user?.name || 'Unknown artist', album: UNKNOWN_ALBUM,
      albumArtist: '', trackNo: 0, duration: t.duration || 0, cover: t.artwork?.['480x480'] || t.artwork?.['150x150'] || '',
    }));
  },
  async archive(q){
    const query = q ? `(${q}) AND mediatype:(audio)` : 'collection:(netlabels) AND mediatype:(audio)';
    const s = await getJSON(`https://archive.org/advancedsearch.php?q=${encodeURIComponent(query)}&fl[]=identifier&fl[]=title&fl[]=creator&sort[]=${encodeURIComponent('downloads desc')}&rows=8&output=json`);
    const docs = s.response?.docs || [];
    const items = await Promise.all(docs.map(d => getJSON(`https://archive.org/metadata/${encodeURIComponent(d.identifier)}`).then(m => ({ d, m })).catch(() => null)));
    const out = [];
    for (const it of items){
      if (!it) continue;
      const { d, m } = it;
      let files = (m.files || []).filter(f => /\.mp3$/i.test(f.name));
      const orig = files.filter(f => f.source === 'original');
      if (orig.length) files = orig; else { const vbr = files.filter(f => f.format === 'VBR MP3'); if (vbr.length) files = vbr; }
      const seen = new Set();
      for (const f of files.slice(0, 25)){
        const title = f.title || f.name.replace(/\.mp3$/i, '').split('/').pop();
        if (seen.has(title)) continue; seen.add(title);
        out.push({
          src: 'archive', extId: d.identifier + '/' + f.name, title,
          artist: f.artist || f.creator || first(d.creator) || first(m.metadata?.creator) || 'Unknown artist',
          album: f.album || first(d.title) || first(m.metadata?.title) || UNKNOWN_ALBUM, albumArtist: '',
          trackNo: parseInt(f.track) || 0, duration: parseLen(f.length),
          cover: `https://archive.org/services/img/${encodeURIComponent(d.identifier)}`,
          url: `https://archive.org/download/${encodeURIComponent(d.identifier)}/${f.name.split('/').map(encodeURIComponent).join('/')}`,
        });
      }
      if (out.length >= 60) break;
    }
    return out;
  },
  async jamendo(q){
    const p = new URLSearchParams({ client_id: S.jamendoId, format: 'json', limit: '40', audioformat: 'mp32', imagesize: '300' });
    if (q) p.set('search', q); else p.set('order', 'popularity_week');
    const j = await getJSON('https://api.jamendo.com/v3.0/tracks/?' + p);
    if (j.headers && j.headers.status && j.headers.status !== 'success') throw new Error(j.headers.error_message || 'request rejected');
    return (j.results || []).filter(t => t.audio).map(t => ({
      src: 'jamendo', extId: t.id, title: t.name, artist: t.artist_name || 'Unknown artist', album: t.album_name || UNKNOWN_ALBUM,
      albumArtist: '', trackNo: +t.position || 0, duration: +t.duration || 0, cover: t.image || t.album_image || '', url: t.audio,
    }));
  },
};
const safeId = s => String(s).replace(/[^A-Za-z0-9_]/g, c => '-' + c.charCodeAt(0).toString(16));
function addEph(r){
  const id = r.src + '_' + safeId(r.extId);
  if (!S.tracks.has(id)) S.tracks.set(id, { ...r, id, eph: true, addedAt: 0 });
  return id;
}
function saveTrack(t){
  if (!t || !t.eph) return;
  t.eph = false; t.addedAt = Date.now();
  DB.put('tracks', t).catch(() => {}); updateStorage();
}
async function downloadOffline(id){
  const t = S.tracks.get(id); if (!t || !t.src) return;
  saveTrack(t); toast('Downloading…', 60000);
  try{
    const res = await fetch(await streamUrl(t)); if (!res.ok) throw new Error();
    await saveFile(id, await res.blob()); t.offline = true; await DB.put('tracks', t);
    toast('Available offline'); updateStorage();
  }catch(e){
    toast(e && e.name === 'QuotaExceededError' ? 'Browser storage is full.' : `${SRC_FULL[t.src]} doesn’t allow in-browser downloads for this song, so it stays streaming-only.`, 4500);
  }
}
const discKey = () => S.discSrc + '|' + S.dq.trim().toLowerCase();
function discBody(){
  const c = S.discCache.get(discKey());
  if (!c){ queueMicrotask(loadDiscover); return `<p class="empty-small">Loading…</p>`; }
  return renderDisc(c);
}
async function loadDiscover(){
  const key = discKey(); if (S.discLoading.has(key) || S.discCache.has(key)) return;
  S.discLoading.add(key);
  const q = S.dq.trim();
  const srcs = S.discSrc === 'all' ? ['audius', 'archive', 'jamendo'] : [S.discSrc];
  const sections = await Promise.all(srcs.map(async s => {
    if (s === 'jamendo' && !S.jamendoId) return { s, needsKey: true, ids: [] };
    try{ return { s, ids: (await SOURCES[s](q)).map(addEph) }; }
    catch(e){ return { s, error: (e && e.message) || 'request failed', ids: [] }; }
  }));
  S.discLoading.delete(key); S.discCache.set(key, sections);
  if (S.view.name === 'discover' && discKey() === key){ const el = $('#disc'); if (el){ el.innerHTML = renderDisc(sections); updatePlayer(); } }
}
function jamendoSetup(){
  return `<div class="setup"><p><b>Jamendo needs a free client ID.</b> Create an app at <a href="https://devportal.jamendo.com" target="_blank" rel="noopener">devportal.jamendo.com</a> and paste its client ID here. It’s saved in this browser only.</p>
    <form class="setup-row" data-form="jamendo"><input name="cid" placeholder="Client ID" autocomplete="off" aria-label="Jamendo client ID" required><button class="btn" type="submit">Save</button></form></div>`;
}
function renderDisc(sections){
  const q = S.dq.trim();
  const titles = { audius: 'Trending on Audius this week', archive: 'Popular on Internet Archive netlabels', jamendo: 'Popular on Jamendo this week' };
  return sections.map(sec => {
    let body;
    if (sec.needsKey) body = jamendoSetup();
    else if (sec.error) body = `<p class="empty-small">Couldn’t reach ${SRC_FULL[sec.s]} (${esc(sec.error)}). Check your connection, then <button class="link" data-act="disc-retry">try again</button>.</p>`;
    else if (!sec.ids.length) body = `<p class="empty-small">No ${q ? `matches for “${esc(q)}”` : 'tracks'} on ${SRC_FULL[sec.s]}.</p>`;
    else body = trackTable(sec.ids, reg(sec.ids, SRC_FULL[sec.s], 'disc:' + sec.s + ':' + q));
    const aside = sec.s === 'jamendo' && S.jamendoId ? `<button class="link" data-act="jam-reset">Change client ID</button>` : '';
    return section(q ? SRC_FULL[sec.s] : titles[sec.s], aside, body);
  }).join('') + `<p class="note">These songs come from open catalogs where artists publish music for free streaming. Licenses vary by track, so check them before reusing a song anywhere else.</p>`;
}
function vDiscover(){
  const chips = [['all', 'All sources'], ['audius', 'Audius'], ['archive', 'Internet Archive'], ['jamendo', 'Jamendo']]
    .map(([k, l]) => `<button class="chip${S.discSrc === k ? ' active' : ''}" data-act="disc-src" data-src="${k}">${l}</button>`).join('');
  return `<div class="content"><h1 class="page-title">Discover</h1>
    <label class="searchbox disc-search">${icon('search', 18)}<input id="dq" type="search" placeholder="Search free music online" value="${esc(S.dq)}" autocomplete="off" aria-label="Search free music online"></label>
    <div class="chips" style="margin-top:14px">${chips}</div>
    <div id="disc">${discBody()}</div></div>`;
}
document.addEventListener('submit', e => {
  const f = e.target;
  if (f.dataset && f.dataset.form === 'jamendo'){
    e.preventDefault();
    const v = f.cid.value.trim(); if (!v) return;
    S.jamendoId = v; saveKV('jamendoId', v); S.discCache.clear(); render(); toast('Jamendo connected', 1600);
  }
});

/* ---------- Events ---------- */
function playRow(row){
  const L = S.lists[row.dataset.list]; if (!L) return;
  if (row.dataset.id === S.current && L.sig === S.contextSig) togglePlay();
  else playFrom(L.ids, row.dataset.id, L.label, L.sig);
}
function act(el){
  const a = el.dataset.act, d = el.dataset, mid = menu.dataset.id;
  if (a.startsWith('m-')) closeMenu();
  switch (a){
    case 'nav': return go({ name: d.view });
    case 'back': return back();
    case 'import': return $('#fileIn').click();
    case 'import-dir': return $('#dirIn').click();
    case 'liked': return go({ name: 'liked' });
    case 'playlist': return go({ name: 'playlist', id: d.pid });
    case 'album': return go({ name: 'album', key: d.key });
    case 'artist': return go({ name: 'artist', artist: d.artist });
    case 'libtab': S.libTab = d.tab; return render();
    case 'libtab-go': S.libTab = d.tab; return go({ name: 'library' });
    case 'new-playlist': return newPlaylist();
    case 'rowplay': return playRow(el.closest('.row'));
    case 'play-track': { const L = S.lists[d.list]; return L && playFrom(L.ids, d.id, L.label, L.sig); }
    case 'play-list': { const L = S.lists[d.list]; if (!L || !L.ids.length) return; if (S.current && L.sig === S.contextSig) return togglePlay(); return playFrom(L.ids, null, L.label, L.sig); }
    case 'like': return toggleLike(d.id);
    case 'like-current': return S.current && toggleLike(S.current);
    case 'more': return menu.hidden || menu.dataset.id !== d.id ? openMenu(d.id, el) : closeMenu();
    case 'toggle': return togglePlay();
    case 'next': return next();
    case 'prev': return prev();
    case 'shuffle': return toggleShuffle();
    case 'repeat': return cycleRepeat();
    case 'mute': return toggleMute();
    case 'queue': return setQueue(qEl.hidden);
    case 'pl-rename': return renamePlaylist(d.pid);
    case 'pl-delete': return deletePlaylist(d.pid);
    case 'q-pick': { const id = S.userQueue.splice(+d.i, 1)[0]; return id && playId(id); }
    case 'q-remove': S.userQueue.splice(+d.i, 1); return renderQueue();
    case 'q-clear': S.userQueue = []; return renderQueue();
    case 'q-jump': S.pos += 1 + (+d.off); return playId(ctxId());
    case 'm-next': S.userQueue.unshift(mid); renderQueue(); return toast('Playing next', 1600);
    case 'm-queue': S.userQueue.push(mid); renderQueue(); return toast('Added to queue', 1600);
    case 'm-like': return toggleLike(mid);
    case 'm-newpl': return newPlaylist(mid);
    case 'm-addpl': return addToPlaylist(d.pid, mid);
    case 'm-rmpl': { const p = S.playlists.find(x => x.id === menu.dataset.pid); if (!p) return; p.trackIds = p.trackIds.filter(x => x !== mid); persistLib(); render(); return toast(`Removed from ${p.name}`, 1600); }
    case 'm-album': { const t = S.tracks.get(mid); return t && go({ name: 'album', key: albumKey(t) }); }
    case 'm-artist': { const t = S.tracks.get(mid); return t && go({ name: 'artist', artist: t.artist }); }
    case 'm-delete': return deleteTrack(mid);
    case 'm-save': saveTrack(S.tracks.get(mid)); return toast('Saved to your library', 1600);
    case 'm-offline': return downloadOffline(mid);
    case 'disc-src': S.discSrc = d.src; return render();
    case 'disc-retry': S.discCache.delete(discKey()); return render();
    case 'search-online': S.dq = S.query.trim(); S.discSrc = 'all'; return go({ name: 'discover' });
    case 'jam-reset': S.jamendoId = ''; saveKV('jamendoId', ''); S.discCache.clear(); return render();
  }
}
document.addEventListener('click', e => {
  if (!e.target.closest('.menu') && !e.target.closest('[data-act="more"]')) closeMenu();
  const el = e.target.closest('[data-act]');
  if (el){ if (!el.disabled) act(el); return; }
  const row = e.target.closest('.row'); if (row) playRow(row);
});
document.addEventListener('input', e => {
  if (e.target.id === 'q'){ S.query = e.target.value; $('#results').innerHTML = searchResults(); }
  else if (e.target.id === 'dq'){
    const v = e.target.value; clearTimeout(dqTimer);
    dqTimer = setTimeout(() => { S.dq = v; const el = $('#disc'); if (el) el.innerHTML = discBody(); }, 450);
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'sortSel'){ S.sortName = t.value; render(); }
  else if (t.id === 'fileIn' || t.id === 'dirIn'){ const files = [...t.files]; t.value = ''; importFiles(files); }
});
document.addEventListener('keydown', e => {
  if (!modal.hidden) return;
  if (e.key === 'Escape'){ closeMenu(); if (!qEl.hidden) setQueue(false); return; }
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
  if ((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute && e.target.getAttribute('role') === 'button'){ e.preventDefault(); e.target.click(); return; }
  if (e.key === ' '){ e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowRight' && e.shiftKey) next();
  else if (e.key === 'ArrowLeft' && e.shiftKey) prev();
  else if (e.key === 'ArrowRight' && S.current){ e.preventDefault(); audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5); }
  else if (e.key === 'ArrowLeft' && S.current){ e.preventDefault(); audio.currentTime = Math.max(0, audio.currentTime - 5); }
  else if (e.key === 'm' || e.key === 'M') toggleMute();
  else if ((e.key === 'l' || e.key === 'L') && S.current) toggleLike(S.current);
  else if (e.key === '/'){ e.preventDefault(); go({ name: 'search' }); $('#q')?.focus(); }
});
main.addEventListener('scroll', closeMenu, { passive: true });
addEventListener('resize', closeMenu);

const drop = $('#drop'); let dragDepth = 0;
const hasFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
addEventListener('dragenter', e => { if (hasFiles(e)){ dragDepth++; drop.hidden = false; } });
addEventListener('dragleave', e => { if (hasFiles(e)){ dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) drop.hidden = true; } });
addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
addEventListener('drop', e => {
  if (!hasFiles(e)) return;
  e.preventDefault(); dragDepth = 0; drop.hidden = true;
  filesFromDrop(e.dataTransfer).then(importFiles);
});

/* ---------- Init ---------- */
document.querySelectorAll('[data-icon]').forEach(el => el.insertAdjacentHTML('afterbegin', icon(el.dataset.icon, +el.dataset.size || 20)));
$('#player').innerHTML = `
  <div class="np"><div id="npArt"></div><div class="np-meta"><div class="np-t" id="npTitle"></div><div class="np-a" id="npArtist"></div></div>
    <button class="icon-btn np-like" id="npLike" data-act="like-current" hidden></button></div>
  <div class="ctrl">
    <div class="btns">
      <button class="icon-btn" data-act="shuffle" aria-label="Shuffle" title="Shuffle">${icon('shuffle', 18)}</button>
      <button class="icon-btn" data-act="prev" aria-label="Previous" title="Previous (Shift + ←)">${icon('prev', 20)}</button>
      <button class="play" id="playBtn" data-act="toggle" title="Play/pause (Space)"></button>
      <button class="icon-btn" data-act="next" aria-label="Next" title="Next (Shift + →)">${icon('next', 20)}</button>
      <button class="icon-btn" data-act="repeat" id="repBtn" title="Repeat"></button>
    </div>
    <div class="seek"><span id="tCur">0:00</span><input class="range" id="seekR" type="range" min="0" max="1000" value="0" aria-label="Seek"><span id="tDur">0:00</span></div>
  </div>
  <div class="extra">
    <button class="icon-btn" data-act="queue" id="qBtn" aria-label="Queue" title="Queue">${icon('queue', 18)}</button>
    <button class="icon-btn" data-act="mute" id="muteBtn" title="Mute (M)"></button>
    <input class="range" id="volR" type="range" min="0" max="100" aria-label="Volume">
  </div>`;

const seekR = $('#seekR');
seekR.addEventListener('input', () => {
  seeking = true;
  const d = audio.duration || 0, p = seekR.value / 10;
  seekR.style.setProperty('--p', p + '%'); $('#tCur').textContent = fmt(p / 100 * d) === '–' ? '0:00' : fmt(p / 100 * d);
});
seekR.addEventListener('change', () => { const d = audio.duration || 0; if (d) audio.currentTime = seekR.value / 1000 * d; seeking = false; });
$('#volR').addEventListener('input', e => {
  audio.volume = e.target.value / 100; audio.muted = false; S.volume = audio.volume; S.muted = false; updateVolUI(); persistSettings();
});

audio.addEventListener('timeupdate', () => {
  if (seeking) return;
  const d = audio.duration, p = d ? audio.currentTime / d * 100 : 0;
  seekR.value = p * 10; seekR.style.setProperty('--p', p + '%');
  $('#tCur').textContent = fmt(audio.currentTime) === '–' ? '0:00' : fmt(audio.currentTime);
});
audio.addEventListener('loadedmetadata', () => {
  $('#tDur').textContent = fmt(audio.duration);
  const t = S.tracks.get(S.current);
  if (t && !t.duration && isFinite(audio.duration)){ t.duration = audio.duration; DB.put('tracks', t).catch(() => {}); }
});
audio.addEventListener('play', updatePlayer);
audio.addEventListener('pause', updatePlayer);
audio.addEventListener('playing', () => { errorStreak = 0; });
audio.addEventListener('ended', () => { if (S.repeat === 'one'){ audio.currentTime = 0; audio.play().catch(() => {}); } else next(true); });
audio.addEventListener('error', () => {
  if (!S.current || !audio.getAttribute('src')) return;
  if (++errorStreak > 4){ toast('Several songs in a row couldn’t play. Playback stopped.'); return; }
  toast('This browser can’t play that file. Skipping.');
  setTimeout(() => next(true), 700);
});
if ('mediaSession' in navigator){
  [['play', () => audio.play().catch(() => {})], ['pause', () => audio.pause()], ['previoustrack', prev], ['nexttrack', () => next()],
   ['seekto', d => { audio.currentTime = d.seekTime; }]].forEach(([k, fn]) => { try{ navigator.mediaSession.setActionHandler(k, fn); }catch(e){} });
}

(async () => {
  await load();
  audio.volume = S.volume; audio.muted = S.muted;
  updateVolUI(); render(); updateStorage();
  if (!DB.ok) toast('This browser blocked local storage, so your library resets when you close the page.', 6000);
})();
</script>
</body>
</html>
